# Mesmo padrão de C:\Users\leandro.basso\Desktop\PJT_ANDAMENTO\venduzz\nginx\venduzz.conf,
# adaptado pro site de vendas (porta 3001, path do repo separado). No mesmo VPS do hub
# (92.246.130.89) — server_name diferente é o que faz o nginx rotear certo entre os dois.
server {
    listen 80;
    server_name venduzz.com.br www.venduzz.com.br;

    location /_next/static/ {
        alias /var/www/venduzz-site/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /logos/ {
        alias /var/www/venduzz-site/public/logos/;
        expires 7d;
    }

    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
